{% extends 'base.html' %}

{% block title %}Sisselogimine · Forus Arvestid{% endblock %}

{% block content %}
<section class="login-card">
    <div class="login-brand">
        <img
            src="{{ url_for('static', filename='forus-arvestid.png') }}"
            alt="Forus Arvestid"
            class="login-brand-logo"
        >
    </div>

    <p class="eyebrow">MÕÕDIKUTE HALDUS</p>

    <h1>Forus Arvestid</h1>

    <p class="muted">
        Logi sisse, et jätkata näitude sisestamist.
    </p>

    <form method="post" class="stack-form">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label>
            Kasutajanimi
            <input
                name="username"
                autocomplete="username"
                required
                autofocus
            >
        </label>

        <label>
            Parool
            <input
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >
        </label>

        <button class="button button-primary button-full" type="submit">
            Logi sisse <span>→</span>
        </button>
    </form>
</section>
{% endblock %}
